name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test (Python)
        run: pytest

      - name: Test (frontend logic)
        run: node --test 'frontend/tests/**/*.test.mjs'

      - name: Storage audit (fail only on CRITICAL)
        run: python tools/storage.py audit --warn-files 5000 --warn-bytes 209715200 --crit-files 8000 --crit-bytes 524288000 || test $? -eq 1
