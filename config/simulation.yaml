# Medirover — simulation environment (the demo dashboard)
environment: simulation
host: 0.0.0.0
port: 8000
db_url: sqlite:///data/medirover_sim.db

heartbeat_interval_s: 1.0
telemetry_interval_s: 1.0
stale_after_s: 3.0
offline_after_s: 10.0
supervisor_scan_s: 0.2
identify_timeout_s: 5.0

max_frame_bytes: 16384
frontend_dir: frontend
log_level: INFO
seed: 42

demo:
  node_id: motion-01
  node_name: "Medirover Motion Node (simulated)"
  drop_every_s: 30.0
  drop_for_s: 4.0
  drive_every_s: 15.0
  drive_duration_s: 3.0
