# Medirover — hardware environment (M10; NOT ACTIVELY USED)
#
# Starting the backend in this environment requires:
#   MEDIROVER_HARDWARE_ACK=yes
# as an explicit acknowledgement that physical hardware is connected
# and safety conditions (docs/SAFETY.md) are met.
#
# All timing values below are placeholders (UNKNOWN real hardware).
environment: hardware
host: 0.0.0.0
port: 8000
db_url: sqlite:///data/medirover_hardware.db

heartbeat_interval_s: 1.0
telemetry_interval_s: 1.0
stale_after_s: 3.0
offline_after_s: 10.0
supervisor_scan_s: 0.2
identify_timeout_s: 5.0

max_frame_bytes: 16384
frontend_dir: frontend
log_level: INFO
seed: 42

demo:
  node_id: motion-01
  node_name: "Medirover Motion Node"
  drop_every_s: 0.0
  drop_for_s: 0.0
  drive_every_s: 0.0
  drive_duration_s: 3.0
